const ext = (p) => (p.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase();
// hljs 는 키워드를 한 종류로만 표시해서, VS Code 처럼 흐름 제어 키워드만 따로 칠한다.
const CONTROL_KEYWORD = /<span class="hljs-keyword">(if|else|return|export|import|from|for|while|do|switch|case|default|break|continue|throw|try|catch|finally|await|yield|as)<\/span>/g;
const highlight = (s, lang) => {
  if (!lang || !window.hljs) return esc(s);
  try { return hljs.highlight(s, { language: lang, ignoreIllegals: true }).value.replace(CONTROL_KEYWORD, '<span class="hljs-keyword ctl">$1</span>'); } catch { return esc(s); }
};
const splitPath = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? ['', p] : [p.slice(0, i + 1), p.slice(i + 1)]; };
const lineKey = (side, line) => side + line;
const openComments = (fid) => state.comments.filter((c) => c.fid === fid && !c.done);
const fmtTime = (iso) => { try { return new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };

function parseHash() {
  const m = location.hash.match(/^#(f[0-9a-f]{8})(?:-([no])(\d+))?$/);
  if (!m || (!BY_ID.has(m[1]) && !CTX_BY_ID.has(m[1]))) return { view: 'index' };
  return { view: 'file', fid: m[1], side: m[2], line: m[3] ? Number(m[3]) : null };
}

function render() {
  const route = parseHash();
  state.onIndex = route.view === 'index';
  if (route.view === 'file') { renderFile(route); return; }
  renderIndex();
  window.scrollTo(0, state.indexY);
}

function progressBar() {
  const pct = FILES.length ? (state.reviewed.size / FILES.length) * 100 : 0;
  return el('div', { class: 'progress', role: 'progressbar', 'aria-valuenow': Math.round(pct), 'aria-valuemin': 0, 'aria-valuemax': 100 }, el('i', { style: `width:${pct}%` }));
}

  const typing = document.activeElement?.id === 'gfind-q';

  const del = FILES.reduce((s, f) => s + f.del, 0);
  const bar = $('#bar');

      themeButton()),
    progressBar(),
    el('div', { class: 'meta' },

    el('div', { class: 'bar-row find' },

        autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'search',
        oninput: (e) => { clearTimeout(gsearchTimer); const q = e.target.value; gsearchTimer = setTimeout(() => runGlobalSearch(q), 200); },
        onkeydown: (e) => { if (e.key === 'Escape') { e.target.value = ''; runGlobalSearch(''); } },

  const main = $('#main');
  main.replaceChildren();
  if (state.dbNote) main.append(el('div', { class: `note${state.readOnly ? ' warn' : ''}`, text: state.dbNote }));

  const openCount = state.comments.filter((c) => !c.done).length;
  const doneCount = state.comments.length - openCount;
  const cmtSection = el('section', { class: 'group' }, el('h2', { text: `코멘트 ${state.comments.length}${state.comments.length ? ` · 열림 ${openCount} · 해결 ${doneCount}` : ''}` }));
  if (!state.comments.length) {
    cmtSection.append(el('div', { class: 'empty', text: '아직 코멘트가 없습니다. 파일을 열고 줄을 누르면 그 줄에 코멘트를 남길 수 있습니다.' }));
  } else {
    const list = el('div', { class: 'list cmt-list' });
    const sortKey = (c) => (c.done ? '1' : '0') + c.path + c.side + String(c.line).padStart(6, '0');
    for (const c of [...state.comments].sort((a, b) => sortKey(a).localeCompare(sortKey(b)))) {
      const onPage = BY_ID.has(c.fid) || CTX_BY_ID.has(c.fid);
      list.append(el(onPage ? 'a' : 'div', { class: `row${c.done ? ' resolved' : ''}`, href: onPage ? `#${c.fid}-${c.side}${c.line}` : null },
        el('div', { style: 'min-width:0;display:flex;flex-direction:column;gap:2px' },
          el('div', { class: 'where', text: `${c.path}:${c.line}${c.side === 'o' ? ' (삭제된 줄)' : ''}` }),
          el('div', { class: 'body', text: c.body }),
          ...replyEls(c)),
        el('span', { class: 'meta', text: onPage ? '›' : '변경 목록에 없음' })));
    }
    cmtSection.append(list);
  }
  main.append(cmtSection);
  main.append(el('section', { class: 'group', id: 'gresults', hidden: true }));
  const fileGroups = el('div', { id: 'filegroups' });
  main.append(fileGroups);

  const groups = new Map();
  for (const f of FILES) {
    const top = f.path.includes('/') ? f.path.split('/')[0] + '/' : '루트';
    if (!groups.has(top)) groups.set(top, []);
    groups.get(top).push(f);
  }
  for (const [name, files] of groups) {
    const list = el('div', { class: 'list' });
    const canWrite = state.db && !state.readOnly && !state.bulk;
    const doneCount = files.filter((f) => state.reviewed.has(f.id)).length;
    const groupBox = el('input', { type: 'checkbox', 'aria-label': `${name} 전체 확인`, checked: doneCount === files.length, disabled: !canWrite, onchange: () => toggleGroup(name, files) });
    groupBox.indeterminate = doneCount > 0 && doneCount < files.length;
    for (const f of files) {
      const [dir, base] = splitPath(f.path);
      const n = openComments(f.id).length;
      const done = state.reviewed.has(f.id);
      const stale = state.stale.has(f.id);
      const box = el('input', { type: 'checkbox', 'aria-label': `${f.path} 확인`, checked: done, disabled: !canWrite, onchange: () => toggleReviewed(f) });
      list.append(el('div', { class: `frow${done ? ' done' : ''}` }, el('label', { class: 'tick' }, box), el('a', { class: `row${done ? ' done' : ''}`, href: `#${f.id}` },
        el('span', { class: `st ${f.status}`, text: f.status, title: { A: '새 파일', M: '수정', D: '삭제' }[f.status] }),
        el('span', { class: 'p' }, el('span', { text: dir }), el('b', { text: base })),
        el('span', { class: 'r' },
          n ? el('span', { class: 'chip', text: `💬${n}` }) : null,
          el('span', { class: 'plus', text: `+${f.add}` }),
          el('span', { class: 'minus', text: `−${f.del}` }),
          stale ? el('span', { class: 'stale', text: '바뀜', title: '확인한 뒤 다시 바뀌었습니다' }) : null))));
    }
    fileGroups.append(el('section', { class: 'group' }, el('h2', { class: 'with-tick' }, el('label', { class: 'tick' }, groupBox), `${name} ${files.length}`,
      state.undo?.name === name ? el('button', { class: 'btn undo', type: 'button', disabled: !canWrite, onclick: undoGroup, text: `되돌리기 ${state.undo.files.length}개` }) : null), list));
  }
  if (state.gq) runGlobalSearch(state.gq);
  if (typing) $('#gfind-q')?.focus();
}

function runGlobalSearch(q) {
  state.gq = q;
  const box = $('#gresults');
  const groupsNode = $('#filegroups');
  const count = $('#gfind-count');
  if (!box) return;
  box.replaceChildren();
  if (!q) {
    box.hidden = true;
    if (groupsNode) groupsNode.hidden = false;
    if (count) count.textContent = '';
    return;
  }
  const needle = q.toLowerCase();
  const list = el('div', { class: 'list' });
  let total = 0;
  let fileCount = 0;
  for (const f of FILES) {
    const hits = [];
    const hideDel = hidesDel(f);
    for (const h of f.hunks) {
      for (const [t, o, n, s] of h.lines) {
        if (hideDel && t === '-') continue;
        if (s.toLowerCase().includes(needle)) hits.push([t, o, n, s]);
      }
    }
    if (!hits.length) continue;
    fileCount++;
    total += hits.length;
    if (list.childElementCount >= GSEARCH_LIMIT) continue;
    list.append(el('div', { class: 'gfile', text: `${f.path} · ${hits.length}` }));
    for (const [t, o, n, s] of hits.slice(0, GSEARCH_LIMIT)) {
      const side = t === '-' ? 'o' : 'n';
      const line = t === '-' ? o : n;
      const text = s.trimStart();
      const at = text.toLowerCase().indexOf(needle);
      const code = el('span', { class: 'gc', text });
      markText(code, [[{ start: at, end: at + needle.length }, 0]]);
      list.append(el('a', {
        class: `ghit${t === '-' ? ' del' : ''}`, href: `#${f.id}-${side}${line}`,
        onclick: () => { state.search = { open: true, q, matches: [], idx: -1 }; },
      }, el('span', { class: 'gn', text: `${t === '-' ? '−' : ''}${line}` }), code));
    }
  }
  if (count) count.textContent = total ? `${total}줄 · ${fileCount}파일` : '없음';
  box.append(el('h2', { text: `"${q}" 검색 결과` }), total ? list : el('div', { class: 'empty', text: '일치하는 줄이 없습니다.' }));
  box.hidden = false;
  if (groupsNode) groupsNode.hidden = true;
}

function renderFile(route) {
  const idx = BY_ID.get(route.fid);
  const f = fileById(route.fid);
  const prev = f.ctx ? null : FILES[idx - 1];
  const next = f.ctx ? null : FILES[idx + 1];
  const done = state.reviewed.has(f.id);

  const bar = $('#bar');
  bar.replaceChildren(
    el('div', { class: 'bar-row tools' },
      el('a', { class: 'btn', href: '#', 'aria-label': '파일 목록' }, '‹ 목록'),
      f.ctx ? el('button', { class: 'btn', type: 'button', onclick: goBack }, '‹ 뒤로') : null,
      el('span', { class: 'meta', text: f.ctx ? '변경 없음' : `${idx + 1}/${FILES.length}` }),
      el('span', { style: 'flex:1' }),
      el('button', { class: `btn${state.search.open ? ' on' : ''}`, id: 'find-btn', type: 'button', onclick: openSearch }, '찾기'),
      el('button', { class: `btn${state.full ? ' on' : ''}`, type: 'button', onclick: toggleFull, title: '끄면 바뀐 곳 주변만 보입니다' }, '전체'),
      el('button', { class: `btn${state.wrap ? ' on' : ''}`, type: 'button', onclick: toggleWrap }, '줄바꿈'),
      f.status === 'D' || f.ctx ? null : el('button', { class: `btn${state.del ? ' on' : ''}`, type: 'button', onclick: toggleDel, title: '끄면 지운 줄 자리에 빨간 선만 남습니다' }, '지운 줄'),
      themeButton(),
      f.ctx ? null : el('button', { class: `btn${done ? ' on' : ''}`, id: 'rv-btn', type: 'button', onclick: () => toggleReviewed(f), disabled: !state.db || state.readOnly }, done ? '✓ 확인함' : '확인'),
    ),
    el('div', { class: 'bar-row' },
      el('span', { class: `st ${f.status}`, text: f.status }),
      el('span', { class: 'bar-path', text: f.path }),
      el('span', { class: 'meta' }, el('span', { class: 'plus', text: `+${f.add}` }), ' ', el('span', { class: 'minus', text: `−${f.del}` }))),
    el('div', { class: 'bar-row find', id: 'find-row', hidden: !state.search.open },
      el('input', {
        id: 'find-q', type: 'search', value: state.search.q, placeholder: '이 파일에서 찾기', 'aria-label': '이 파일에서 찾기',
        autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'search',
        oninput: (e) => { clearTimeout(searchTimer); const q = e.target.value; searchTimer = setTimeout(() => runSearch(q), 150); },
        onkeydown: (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(searchTimer);
            if (e.target.value !== state.search.q) runSearch(e.target.value); else goMatch(e.shiftKey ? -1 : 1);
          } else if (e.key === 'Escape') closeSearch();
        },
      }),
      el('span', { class: 'meta', id: 'find-count' }),
      el('button', { class: 'btn', type: 'button', 'aria-label': '이전 결과', onclick: () => goMatch(-1) }, '↑'),
      el('button', { class: 'btn', type: 'button', 'aria-label': '다음 결과', onclick: () => goMatch(1) }, '↓'),
      el('button', { class: 'btn', type: 'button', 'aria-label': '찾기 닫기', onclick: closeSearch }, '✕')),
    progressBar(),
  );

  const main = $('#main');
  main.replaceChildren();
  if (state.dbNote) main.append(el('div', { class: `note${state.readOnly ? ' warn' : ''}`, text: state.dbNote }));

  const hideDel = hidesDel(f);
  const diff = el('div', { class: `diff${state.wrap ? '' : ' nowrap'}${hideDel ? ' nodel' : ''}`, id: 'diff' });
  if (f.binary) diff.append(el('div', { class: 'hunk', text: '바이너리 파일이라 내용을 보여 주지 않습니다.' }));
  if (f.gone) diff.append(el('div', { class: 'hunk', text: '작업 트리에 이 파일이 없습니다(이름이 바뀌었거나 지워짐). 남은 코멘트만 보여 줍니다.' }));
  const lang = LANG[ext(f.path)];
  const keep = new Set(state.comments.filter((c) => c.fid === f.id).map((c) => lineKey(c.side, c.line)));
  if (route.line) keep.add(lineKey(route.side, route.line));
  state.ranges = f.hunks.map((h) => foldRanges(h.lines));
  const makeRow = (lines, i, hi) => {
    const [t, o, n, s] = lines[i];
    const side = t === '-' ? 'o' : 'n';
    const line = t === '-' ? o : n;
    let k = i - 1;
    if (hideDel) while (k >= 0 && lines[k][0] === '-') k--;
    const delmark = k < i - 1;
    const chg = (t !== ' ' || delmark) && (k < 0 || lines[k][0] === ' ');
    const row = el('div', {
      class: `ln${t === '+' ? ' add' : t === '-' ? ' del' : ''}${chg ? ' chg' : ''}${delmark ? ' delmark' : ''}`,
      id: `${f.id}-${side}${line}`,
      'data-key': lineKey(side, line),
      'data-code': s,
      'data-h': hi,
      'data-i': i,
      'data-end': state.ranges[hi].get(i),
      tabindex: 0,
    },
      el('span', { class: 'o', text: o || '' }),
      el('span', { class: 'n', text: n || '' }));
    const end = state.ranges[hi].get(i);
    const fd = el('span', { class: `fd${end === undefined ? '' : ' can'}`, 'aria-label': end === undefined ? null : '접기/펴기' });
    if (end !== undefined) fd.addEventListener('click', (e) => { e.stopPropagation(); toggleFold(f, hi, i); });
    row.append(fd);
    const code = el('span', { class: 'c' });
    code.innerHTML = highlight(s, lang) || ' ';
    row.append(code);
    row.addEventListener('click', (e) => {
      const name = t === '-' || window.getSelection()?.toString() ? null : wordAt(e.clientX, e.clientY);
      if (!name || !openRefs(f, line, name, row)) openComposer(f, side, line, s, row);
    });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') openComposer(f, side, line, s, row); });
    return row;
  };
  for (const [hi, h] of f.hunks.entries()) {
    if (f.hunks.length > 1 || h.lines[0]?.[2] > 1 || h.lines[0]?.[1] > 1) diff.append(el('div', { class: 'hunk', text: `${h.h} ${h.ctx}` }));
    const lines = h.lines;
    const visible = visibleLines(lines, keep);
    for (let i = 0; i < lines.length;) {
      if (visible[i]) {
        const [t, o] = lines[i];
        if (!hideDel || t !== '-' || keep.has(lineKey('o', o))) diff.append(makeRow(lines, i, hi));
        i++;
        continue;
      }
      let j = i;
      while (j < lines.length && !visible[j]) j++;
      const from = i;
      const to = j;
      const fold = el('button', { class: 'fold', type: 'button', 'data-h': hi, 'data-from': from, 'data-to': to }, `⋯ 바뀌지 않은 ${to - from}줄 펼치기`);
      fold.addEventListener('click', () => {
        fold.replaceWith(...lines.slice(from, to).map((ln, k) => makeRow(lines, from + k, hi)));
        applyFolds();
        if (state.search.q) applyMarks();
        updateJump();
      });
      diff.append(fold);
      i = j;
    }
  }
  main.append(diff);
  main.append(el('div', { class: 'jump', id: 'jump' },
    el('button', { class: 'btn', type: 'button', 'aria-label': '이전 변경', onclick: () => jumpChange(-1) }, '↑'),
    el('span', { class: 'meta', id: 'jump-count' }),
    el('button', { class: 'btn', type: 'button', 'aria-label': '다음 변경', onclick: () => jumpChange(1) }, '↓')));
  setBarHeight();
  state.search.matches = findMatches(f, state.search.q);
  state.search.idx = -1;
  applyMarks();
  if (!f.ctx) main.append(el('div', { class: 'pager' },
    el('a', { class: 'btn', href: prev ? `#${prev.id}` : '#', 'aria-disabled': prev ? null : 'true' }, prev ? `‹ ${splitPath(prev.path)[1]}` : '처음'),
    el('a', { class: 'btn', href: next ? `#${next.id}` : '#', 'aria-disabled': next ? null : 'true' }, next ? `${splitPath(next.path)[1]} ›` : '마지막')));

  state.composer = null;
  paintThreads(f);

  if (route.line) {
    const target = document.getElementById(`${f.id}-${route.side}${route.line}`);
    if (target) {
      revealRow(target);
      requestAnimationFrame(() => { target.scrollIntoView({ block: 'center' }); target.classList.add('flash'); });
    }
  } else if (!state.full) {
    window.scrollTo(0, 0);
  } else {
    const first = $('#diff .ln.chg');
    if (first && route.keepScroll === undefined) requestAnimationFrame(() => { first.scrollIntoView({ block: 'start' }); updateJump(); });
    else window.scrollTo(0, 0);
  }
  updateJump();
}

function setBarHeight() {
  document.documentElement.style.setProperty('--bar-h', `${$('#bar').offsetHeight + 12}px`);
}
function currentFile() {
  const route = parseHash();
  return route.view === 'file' ? fileById(route.fid) : null;
}

function findMatches(f, q) {
  const out = [];
  if (!q) return out;
  const needle = q.toLowerCase();
  const hideDel = hidesDel(f);
  f.hunks.forEach((h, hi) => h.lines.forEach(([t, o, n, s], li) => {
    if (hideDel && t === '-') return;
    const hay = s.toLowerCase();
    for (let at = hay.indexOf(needle); at >= 0; at = hay.indexOf(needle, at + needle.length)) {
      out.push({ hi, li, key: lineKey(t === '-' ? 'o' : 'n', t === '-' ? o : n), start: at, end: at + needle.length });
    }
  }));
  return out;
}
function applyMarks() {
  const f = currentFile();
  const diff = $('#diff');
  if (!f || !diff) return;
  const lang = LANG[ext(f.path)];
  diff.querySelectorAll('.ln.hit').forEach((row) => {
    row.classList.remove('hit');
    row.querySelector('.c').innerHTML = highlight(row.dataset.code, lang) || ' ';
  });
  const byKey = new Map();
  state.search.matches.forEach((m, i) => {
    if (!byKey.has(m.key)) byKey.set(m.key, []);
    byKey.get(m.key).push([m, i]);
  });
  for (const [key, list] of byKey) {
    const row = document.getElementById(`${f.id}-${key}`);
    if (!row) continue;
    row.classList.add('hit');
    markText(row.querySelector('.c'), list);
  }
  setCurrentMatch();
}
// 하이라이트 span 경계를 넘는 결과도 칠하도록, 줄 전체 기준 위치를 텍스트 노드마다 잘라 감싼다.
function markText(code, list) {
  const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let pos = 0;
  for (let node; (node = walker.nextNode());) { nodes.push([node, pos]); pos += node.data.length; }
  for (const [node, base] of nodes) {
    const end = base + node.data.length;
    const parts = list.filter(([m]) => m.start < end && m.end > base);
    if (!parts.length) continue;
    const frag = document.createDocumentFragment();
    let cursor = 0;
    for (const [m, i] of parts) {
      const a = Math.max(m.start - base, 0);
      const b = Math.min(m.end - base, node.data.length);
      if (a > cursor) frag.append(node.data.slice(cursor, a));
      frag.append(el('mark', { 'data-m': i, text: node.data.slice(a, b) }));
      cursor = b;
    }
    if (cursor < node.data.length) frag.append(node.data.slice(cursor));
    node.replaceWith(frag);
  }
}
function setCurrentMatch() {
  document.querySelectorAll('#diff mark.cur').forEach((m) => m.classList.remove('cur'));
  const { q, matches, idx } = state.search;
  const count = $('#find-count');
  if (count) count.textContent = !q ? '' : !matches.length ? '없음' : idx < 0 ? `${matches.length}개` : `${idx + 1}/${matches.length}`;
  if (idx >= 0) document.querySelectorAll(`#diff mark[data-m="${idx}"]`).forEach((m) => m.classList.add('cur'));
}
function goMatch(dir) {
  const f = currentFile();
  const { matches } = state.search;
  if (!f || !matches.length) return;
  let i = state.search.idx;
  if (i < 0) {
    const top = changeTop();
    i = matches.findIndex((m) => {
      const row = document.getElementById(`${f.id}-${m.key}`);
      return row && row.getBoundingClientRect().top >= top - 4;
    });
    if (i < 0) i = 0;

      .find((fold) => Number(fold.dataset.from) <= m.li && m.li < Number(fold.dataset.to))

function foldRanges(lines) {
  const ranges = new Map();
  const stack = [];
  let prev = -1;
  const close = (d) => {
    while (stack.length && stack[stack.length - 1].d >= d) {
      const top = stack.pop();
      if (prev > top.i) ranges.set(top.i, prev);
    }
  };
  lines.forEach(([, , , s], i) => {
    if (!s.trim()) return;
    const d = s.match(/^[ \t]*/)[0].replace(/\t/g, '  ').length;
    close(d);
    stack.push({ i, d });
    prev = i;
  });
  close(-1);
  return ranges;
}
function applyFolds() {
  const diff = $('#diff');
  const f = currentFile();
  if (!diff || !f) return;
  let h = null;
  let until = -1;
  let hide = false;
  for (const node of diff.children) {
    const cls = node.classList;
    if (cls.contains('hunk')) { h = null; until = -1; hide = false; continue; }
    if (cls.contains('ln') || cls.contains('fold')) {
      if (node.dataset.h !== h) { h = node.dataset.h; until = -1; }
      const i = Number(cls.contains('ln') ? node.dataset.i : node.dataset.from);
      hide = i <= until;
      if (cls.contains('ln')) {
        const shut = !hide && node.dataset.end !== undefined && state.collapsed.has(`${f.id}:${h}:${i}`);
        cls.toggle('folded', shut);
        if (shut) until = Math.max(until, Number(node.dataset.end));
      }
    }
    node.hidden = hide;
  }
}
function toggleFold(f, hi, i) {
  const k = `${f.id}:${hi}:${i}`;
  if (state.collapsed.has(k)) state.collapsed.delete(k); else state.collapsed.add(k);
  applyFolds();
  updateJump();
}
function revealRow(row) {
  const f = currentFile();
  if (!row?.hidden || !f) return;
  const hi = Number(row.dataset.h);
  const i = Number(row.dataset.i);
  for (const [start, end] of state.ranges[hi] || []) {
    if (start < i && i <= end) state.collapsed.delete(`${f.id}:${hi}:${start}`);
  }

}
function visibleLines(lines, keep) {
  if (state.full || lines.every(([t]) => t === ' ')) return lines.map(() => true);
  const near = new Array(lines.length).fill(Infinity);
  let last = -Infinity;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i][0] !== ' ') last = i;
    near[i] = i - last;
  }
  last = Infinity;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i][0] !== ' ') last = i;
    near[i] = Math.min(near[i], last - i);
  }
  return lines.map(([t, o, n], i) => near[i] <= FOLD_CONTEXT || keep.has(lineKey(t === '-' ? 'o' : 'n', t === '-' ? o : n)));
}

function paintThreads(f) {
  const diff = $('#diff');
  if (!diff) return;
  diff.querySelectorAll('.thread').forEach((n) => n.remove());
  diff.querySelectorAll('.ln.has-cmt').forEach((n) => n.classList.remove('has-cmt'));
  const mine = state.comments.filter((c) => c.fid === f.id);
  const byKey = new Map();
  for (const c of mine) {
    const k = lineKey(c.side, c.line);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(c);
  }
  const lost = [];
  for (const [k, list] of byKey) {
    const row = diff.querySelector(`.ln[data-key="${k}"]`);
    if (!row) { lost.push(...list); continue; }
    row.classList.add('has-cmt');
    const anchor = row.nextElementSibling?.classList.contains('composer') ? row.nextElementSibling : row;
    anchor.after(threadEl(list, null, row.dataset.code));
  }
  if (lost.length) diff.prepend(threadEl(lost, '이 diff 에서 줄을 찾지 못한 코멘트'));
  applyFolds();
}

function threadEl(list, title, current) {

  }
  return box;
  function lost(c) { return title ? `${c.side === 'o' ? '삭제 줄 ' : ''}${c.line}행 · ` : ''; }

    const canWrite = !state.readOnly && state.db;
    const del = el('button', { class: 'btn', type: 'button' }, '삭제');

      setTimeout(() => { delete del.dataset.arm; del.textContent = '삭제'; del.classList.remove('on'); }, 3000);
    });

    const toggleFold = (e) => { e.stopPropagation(); state.cmtFold.set(c.id, !folded); e.currentTarget.closest('.cmt').replaceWith(cmtView(c)); };
    const replyCount = Array.isArray(c.replies) ? c.replies.length : 0;
    if (folded) {
      const node = el('div', { class: `cmt folded${c.done ? ' done' : ''}`, onclick: toggleFold },
        el('div', { class: 'body', text: c.body }),
        el('div', { class: 'acts' },
          el('span', { class: 'meta', text: `${lost(c)}${fmtTime(c.at)}${replyCount ? ` · 답글 ${replyCount}` : ''}${c.done ? ' · 해결됨' : ''}` }),
          el('button', { class: 'btn', type: 'button', onclick: toggleFold }, '펼치기'),
          canWrite ? del : null));
      return node;
    }
    const node = el('div', { class: `cmt${c.done ? ' done' : ''}` },
      el('div', { class: 'body', text: c.body }),
      ...replyEls(c, canWrite ? {
        edit: (i) => { state.editing = { id: c.id, draft: c.replies[i].body, replyIndex: i }; node.replaceWith(cmtEditor(c)); },
        remove: (i) => removeReply(c, i),
      } : null),

        ? el('div', { class: 'orig' }, el('span', { class: 'meta', text: title ? '줄 내용' : '원래 줄(그 뒤 바뀜)' }), el('code', { text: c.code || ' ' }))
        : null,

        el('span', { class: 'meta', text: `${lost(c)}${fmtTime(c.at)}${c.editedAt ? ' · 수정됨' : ''}${c.done ? ' · 해결됨' : ''}` }),
        canWrite ? el('button', { class: 'btn', type: 'button', onclick: (e) => { e.stopPropagation(); state.editing = { id: c.id, draft: '', reply: true }; node.replaceWith(cmtEditor(c)); } }, '답글') : null,
        canWrite ? el('button', { class: 'btn', type: 'button', onclick: (e) => { e.stopPropagation(); state.editing = { id: c.id, draft: c.body }; node.replaceWith(cmtEditor(c)); } }, '수정') : null,
        canWrite ? el('button', { class: 'btn', type: 'button', onclick: (e) => { e.stopPropagation(); toggleDone(c); } }, c.done ? '다시 열기' : '해결') : null,
        canWrite ? del : null,
        el('button', { class: 'btn', type: 'button', onclick: toggleFold }, '접기')));

  // 고치는 중에 다른 코멘트 변경으로 스레드를 다시 그려도 쓰던 글이 남도록 state.editing 에 둔다.

    const ta = el('textarea', { 'aria-label': reply ? '답글' : replyIndex !== null ? '답글 수정' : '코멘트 수정', placeholder: reply ? '답글을 달면 해결된 코멘트도 다시 열립니다.' : null });

    return node;
  }
}

function openComposer(f, side, line, code, row) {
  if (state.composer) {
    const same = state.composer.key === lineKey(side, line);
    if (state.composer.node.querySelector('textarea').value.trim() && !same) { state.composer.node.querySelector('textarea').focus(); return; }
    state.composer.node.remove();
    state.composer = null;
    if (same) return;
  }
  if (!state.db) { flashNote('코멘트 저장소에 연결되지 않아 지금은 코멘트를 남길 수 없습니다.'); return; }
  if (state.readOnly) { flashNote('이 화면에서는 코멘트를 쓸 권한이 없습니다.'); return; }
  const ta = el('textarea', { id: 'composer-text', placeholder: `${side === 'o' ? '삭제된 ' : ''}${line}행에 대한 코멘트`, 'aria-label': '코멘트' });
  const err = el('div', { class: 'err', hidden: true });
  const save = el('button', { class: 'btn primary', type: 'button' }, '저장');
  const cancel = el('button', { class: 'btn', type: 'button' }, '취소');
  const node = el('div', { class: 'composer', onclick: (e) => e.stopPropagation() }, ta, err, el('div', { class: 'acts' }, cancel, save));
  cancel.addEventListener('click', () => { node.remove(); state.composer = null; });
  save.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body) { ta.focus(); return; }
    save.disabled = true; save.textContent = '저장 중';
    try {
      await state.db.collection('comments').add({ fid: f.id, path: f.path, side, line, code, body, at: new Date().toISOString(), done: false });
      node.remove(); state.composer = null;
    } catch (e) {
      err.hidden = false;
      err.textContent = e?.code === 'quota_exceeded' ? '코멘트 저장 공간이 가득 찼습니다. 해결된 코멘트를 지운 뒤 다시 저장해 주세요.' : `저장하지 못했습니다(${e?.code || '오류'}). 다시 눌러 주세요.`;
      save.disabled = false; save.textContent = '저장';
    }
  });
  row.after(node);
  state.composer = { key: lineKey(side, line), node };
  ta.focus();
}

// 참조: build.mjs 가 refs.mjs 로 모은 TypeScript 심볼. "파일번호:줄:이름" 으로 찾는다.
const REFS = DATA.refs;
const unpackRefs = (packed) => (packed ? packed.split('|').map((g) => {
  const [p, lines] = g.split(':');
  return [Number(p), lines.split(',').map(Number)];
}) : []);
const REF_AT = new Map();
REFS?.symbols.forEach(([name, defs, refs], i) => {
  for (const [p, lines] of [...unpackRefs(defs), ...unpackRefs(refs)]) for (const l of lines) REF_AT.set(`${p}:${l}:${name}`, i);
});
const REF_PATH = new Map(REFS?.paths.map((p, i) => [p, i]) ?? []);
const newLines = new Map();
function newLineText(f, line) {
  if (!newLines.has(f.id)) newLines.set(f.id, new Map(f.hunks.flatMap((h) => h.lines.filter(([t]) => t !== '-').map(([, , n, s]) => [n, s]))));
  return newLines.get(f.id).get(line) ?? '';
}
function wordAt(x, y) {
  let node = null;
  let offset = 0;
  if (document.caretPositionFromPoint) { const pos = document.caretPositionFromPoint(x, y); node = pos?.offsetNode; offset = pos?.offset ?? 0; }
  else if (document.caretRangeFromPoint) { const range = document.caretRangeFromPoint(x, y); node = range?.startContainer; offset = range?.startOffset ?? 0; }
  if (!node || node.nodeType !== Node.TEXT_NODE || !node.parentElement?.closest('.c')) return null;
  const text = node.textContent;
  const isWord = (ch) => /[\w$#]/.test(ch ?? '');
  let a = offset;
  let b = offset;
  while (a > 0 && isWord(text[a - 1])) a--;
  while (b < text.length && isWord(text[b])) b++;
  return a < b ? text.slice(a, b) : null;
}
function closeRefs() { $('#refs')?.remove(); }
function openRefs(f, line, name, row) {
  if (!REFS) return false;
  const p = REF_PATH.get(f.path);
  const i = REF_AT.get(`${p}:${line}:${name}`) ?? REF_AT.get(`${p}:${line}:${name.replace(/^#/, '')}`);
  if (i === undefined) return false;
  closeRefs();
  const [symbol, defs, refs] = REFS.symbols[i];
  // 지금 파일, 페이지에 있는 파일, 나머지 순.
  const rank = (gp) => (gp === p ? 0 : BY_PATH.has(REFS.paths[gp]) ? 1 : 2);
  const order = (groups) => groups.sort((x, y) => rank(x[0]) - rank(y[0]) || REFS.paths[x[0]].localeCompare(REFS.paths[y[0]]));
  const count = (groups) => groups.reduce((sum, [, lines]) => sum + lines.length, 0);
  const d = order(unpackRefs(defs));
  const r = order(unpackRefs(refs));
  const list = el('div', { class: 'refs-list' });
  for (const [title, groups] of [[`정의 ${count(d)}`, d], [`사용 ${count(r)}`, r]]) {
    if (!groups.length) continue;
    list.append(el('h3', { text: title }));
    for (const [gp, lines] of groups) {
      const path = REFS.paths[gp];
      const target = BY_PATH.get(path);
      list.append(el('div', { class: 'refs-file', text: target && !target.ctx ? path : `${path} (변경 없음)` }));
      for (const l of lines) {
        const text = (target ? newLineText(target, l) : REFS.snippets[gp]?.[l] ?? '').trim();
        const kids = [el('span', { class: 'n', text: l }), el('code', { text })];
        list.append(target
          ? el('a', { class: `refs-row${gp === p && l === line ? ' here' : ''}`, href: `#${target.id}-n${l}` }, ...kids)
          : el('div', { class: 'refs-row off' }, ...kids));
      }
    }
  }
  document.body.append(el('div', { class: 'refs', id: 'refs', role: 'dialog', 'aria-label': `${symbol} 참조` },
    el('div', { class: 'refs-head' },
      el('b', { text: symbol }),
      el('span', { class: 'meta', text: `정의 ${count(d)}, 사용 ${count(r)}` }),
      el('span', { style: 'flex:1' }),
      el('button', { class: 'btn', type: 'button', onclick: () => { closeRefs(); openComposer(f, 'n', line, row.dataset.code, row); } }, '코멘트'),
      el('button', { class: 'btn', type: 'button', 'aria-label': '닫기', onclick: closeRefs }, '✕')),
    list));
  return true;
}
window.addEventListener('hashchange', closeRefs);

// db 에 일괄 쓰기가 없어 파일마다 문서를 두면 섹션 일괄 처리가 한 건씩 느리게 저장된다.

async function setReviewed(files, done) {
  const at = new Date().toISOString();
  const patch = Object.fromEntries(files.map((f) => [f.id, done ? { path: f.path, hash: f.hash, at } : null]));
  const ref = state.db.doc(CHECKS_DOC);
  try {
    if (state.checksExist) await ref.update({ files: patch });
    else await ref.set({ files: patch });
  } catch (e) {
    if (e?.code === 'invalid_argument') { state.readOnly = true; state.dbNote = '이 화면에서는 기록할 권한이 없어 읽기만 됩니다.'; }
    else state.dbNote = `확인 표시를 저장하지 못했습니다(${e?.code || '오류'}).`;

  }
}
// 되돌리기는 마지막 일괄 처리 하나만 기억한다. 그 뒤 파일 하나를 직접 바꾸면 그 선택을 덮어쓰지 않도록 버린다.
function toggleReviewed(f) {
  state.undo = null;
  return setReviewed([f], !state.reviewed.has(f.id));
}
async function writeBulk(files, done) {
  state.bulk = true;
  rerenderKeepingPlace();
  await setReviewed(files, done);
  state.bulk = false;
  rerenderKeepingPlace();
}
function toggleGroup(name, files) {
  const unchecked = files.filter((f) => !state.reviewed.has(f.id));
  const changed = unchecked.length ? unchecked : files;
  state.undo = { name, files: changed, done: !unchecked.length };
  return writeBulk(changed, unchecked.length > 0);
}
function undoGroup() {
  const { files, done } = state.undo;
  state.undo = null;
  return writeBulk(files, done);
}
function toggleWrap() {
  state.wrap = !state.wrap;
  try { localStorage.setItem('wrap', state.wrap ? '1' : '0'); } catch {}
  rerenderAtSameLine();
}
const hidesDel = (f) => !state.del && f.status !== 'D';
function toggleDel() {
  state.del = !state.del;
  try { localStorage.setItem('del', state.del ? '1' : '0'); } catch {}
  rerenderAtSameLine();
}
function themeButton() { return el('button', { class: 'btn', type: 'button', onclick: cycleTheme, title: '자동은 기기 설정을 따릅니다' }, `테마: ${THEME_LABEL[state.theme] || THEME_LABEL.auto}`); }
function cycleTheme(e) {
  state.theme = THEME_NEXT[state.theme] || 'light';
  try { localStorage.setItem('theme', state.theme); } catch {}
  applyTheme();
  e.currentTarget.textContent = `테마: ${THEME_LABEL[state.theme]}`;
}
function toggleFull() {
  state.full = !state.full;
  try { localStorage.setItem('mode', state.full ? 'full' : 'changes'); } catch {}
  rerenderAtSameLine();
}
function rerenderAtSameLine() {
  const top = changeTop();
  const rows = [...document.querySelectorAll('#diff .ln:not([hidden])')];
  const anchor = rows.find((r) => r.getBoundingClientRect().top >= top - 2);
  const offset = anchor ? anchor.getBoundingClientRect().top : 0;
  const route = parseHash();
  if (route.view !== 'file') { render(); return; }
  renderFile({ ...route, line: null, keepScroll: true });
  const again = anchor && document.getElementById(anchor.id);
  if (again) window.scrollTo(0, window.scrollY + again.getBoundingClientRect().top - offset);
  else if (anchor) {
    const side = anchor.dataset.key[0];
    const line = Number(anchor.dataset.key.slice(1));
    const near = [...document.querySelectorAll('#diff .ln')].find((r) => r.dataset.key[0] === side && Number(r.dataset.key.slice(1)) >= line);
    near?.scrollIntoView({ block: 'start' });
  }
  updateJump();
}

function rerenderKeepingPlace() {
  const route = parseHash();
  if (route.view === 'file') {
    const f = fileById(route.fid);
    paintThreads(f);
    const btn = $('#rv-btn');
    const done = state.reviewed.has(f.id);
    if (btn) { btn.classList.toggle('on', done); btn.textContent = done ? '✓ 확인함' : '확인'; btn.disabled = !state.db || state.readOnly; }
    $('#bar .progress').replaceWith(progressBar());
  } else {
    const y = window.scrollY;
    renderIndex();
    window.scrollTo(0, y);
  }
}

// 파일을 그린 뒤의 스크롤은 목록 위치가 아니므로 목록을 보는 동안만 기록한다.
window.addEventListener('scroll', () => { if (state.onIndex) state.indexY = window.scrollY; }, { passive: true });
// 페이지가 프레임 안에서 열려 history.back() 이 듣지 않으므로, 해시 이동 기록을 직접 쌓아 "뒤로"에 쓴다.
const navStack = [];
let lastHash = location.hash;
let goingBack = false;
window.addEventListener('hashchange', () => {
  if (!goingBack) navStack.push(lastHash);
  goingBack = false;
  lastHash = location.hash;
});
function goBack() {
  const prev = navStack.pop() ?? '';
  if ((prev || '#') === (location.hash || '#')) { render(); return; }
  goingBack = true;
  location.hash = prev || '#';
}
window.addEventListener('hashchange', render);
render();

(async () => {
  const db = await window.claude?.use?.('db');
  if (!db) {
    state.dbNote = '코멘트 저장소를 쓸 수 없는 화면입니다. diff 는 읽을 수 있지만 코멘트와 확인 표시는 저장되지 않습니다.';
    rerenderKeepingPlace();
    return;
  }
  state.db = db;
  let pending = 2;
  const timer = setTimeout(() => { state.dbNote = '코멘트를 아직 불러오지 못했습니다. 연결되면 자동으로 나타납니다.'; rerenderKeepingPlace(); }, 10000);
  const settle = (snap) => {
    if (!snap.metadata.fromCache && --pending <= 0) { clearTimeout(timer); if (state.dbNote.startsWith('코멘트를 아직')) state.dbNote = ''; }
  };
  const fail = (e) => { clearTimeout(timer); state.dbNote = `코멘트 저장소 연결이 끊겼습니다(${e.code}). 페이지를 다시 열어 주세요.`; rerenderKeepingPlace(); };
  db.collection('comments').onSnapshot((snap) => {
    state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    settle(snap);
    rerenderKeepingPlace();
  }, fail);
  db.doc(CHECKS_DOC).onSnapshot((snap) => {
    state.checksExist = snap.exists;
    const checks = (snap.exists && snap.data().files) || {};
    const marked = FILES.filter((f) => checks[f.id]);
    state.reviewed = new Set(marked.filter((f) => checks[f.id].hash === f.hash).map((f) => f.id));
    state.stale = new Set(marked.filter((f) => !state.reviewed.has(f.id)).map((f) => f.id));
    settle(snap);
    rerenderKeepingPlace();
  }, fail);
  rerenderKeepingPlace();
})();
</script>
