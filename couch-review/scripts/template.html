<title>__REPO__ 로컬 리뷰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: 파일 목록 한 화면, 파일 하나씩 보는 diff 한 화면. 해시(#파일id-n줄)로 오간다. */
:root {
  --bg: #f2f3f8; --surface: #ffffff; --ink: #1a1f33; --muted: #5d6480; --line: #dcdfea;
  --accent: #8a5a00; --accent-soft: #f6ecd6;
  --add-bg: #e4f4e7; --add-num: #cfe9d5; --add-ink: #1f6b35;
  --del-bg: #fbe8e8; --del-num: #f3d2d2; --del-ink: #9b2c2c;
  --hunk: #eaedf8; --flash: #ffe9a8; --cmt-bg: #fffaf0; --mark: #ffe58a; --mark-cur: #ffb347;
  --kw: #6f3fb3; --str: #1f6b35; --num: #a8540f; --com: #7a8099; --fn: #1d58b5; --type: #8a5a00;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1220; --surface: #161a2b; --ink: #e4e6f0; --muted: #8e94ae; --line: #272c42;
  --accent: #f2c35b; --accent-soft: #2e2814;
  --add-bg: #12271b; --add-num: #173322; --add-ink: #82d99c;
  --del-bg: #2c1519; --del-num: #3a1b20; --del-ink: #f19a9a;
  --hunk: #1b2038; --flash: #4a3e12; --cmt-bg: #1f1d18; --mark: #5c4a12; --mark-cur: #a86a10;
  --kw: #c4a1ff; --str: #9ad8a8; --num: #f5b06b; --com: #6f7592; --fn: #8ab8ff; --type: #f2c35b;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #161a2b; --ink: #e4e6f0; --muted: #8e94ae; --line: #272c42;
  --accent: #f2c35b; --accent-soft: #2e2814;
  --add-bg: #12271b; --add-num: #173322; --add-ink: #82d99c;
  --del-bg: #2c1519; --del-num: #3a1b20; --del-ink: #f19a9a;
  --hunk: #1b2038; --flash: #4a3e12; --cmt-bg: #1f1d18; --mark: #5c4a12; --mark-cur: #a86a10;
  --kw: #c4a1ff; --str: #9ad8a8; --num: #f5b06b; --com: #6f7592; --fn: #8ab8ff; --type: #f2c35b;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.bar-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-row.tools { flex-wrap: wrap; row-gap: 6px; }
.find input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
.find .btn { min-width: 38px; justify-content: center; }
.find .meta { min-width: 5ch; text-align: center; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
mark.cur { background: var(--mark-cur); box-shadow: 0 0 0 1px var(--accent); }
.bar-title { font-weight: 600; font-size: 16px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.bar-path { font-family: var(--mono); font-size: 13px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.btn {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
  padding: 6px 11px; font-size: 13.5px; cursor: pointer; text-decoration: none; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px; min-height: 34px;
}
.btn[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }

main {
  padding-block: 14px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
}
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--del-ink); }

h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.group { display: flex; flex-direction: column; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 10px 12px; text-decoration: none; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row .p { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
.row .p b { font-weight: 500; }
.row .p span { color: var(--muted); }
.row.done { background: var(--add-bg); }
.row.done .p b { color: var(--add-ink); }
.row .r { display: flex; gap: 8px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.st { font-family: var(--mono); font-size: 11px; font-weight: 600; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; }
.st.A { background: var(--add-num); color: var(--add-ink); }
.st.M { background: var(--hunk); color: var(--fn); }
.st.D { background: var(--del-num); color: var(--del-ink); }
.plus { color: var(--add-ink); } .minus { color: var(--del-ink); }
.chip { border-radius: 99px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.check { color: var(--add-ink); font-weight: 600; }
.stale { color: var(--del-ink); font-weight: 600; }

.cmt-list .row { grid-template-columns: minmax(0, 1fr) auto; }
.cmt-list .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.cmt-list .where { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

.diff { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
.diff.nowrap { overflow-x: auto; }
.hunk { background: var(--hunk); color: var(--muted); padding: 4px 10px; font-size: 12px; overflow-wrap: anywhere; border-top: 1px solid var(--line); }
.hunk:first-child { border-top: 0; }
.ln { display: grid; grid-template-columns: 3.6ch 3.6ch minmax(0, 1fr); cursor: pointer; scroll-margin-top: var(--bar-h, 120px); }
.nowrap .ln { grid-template-columns: 3.6ch 3.6ch max-content; min-width: 100%; }
.ln > .o, .ln > .n { color: var(--muted); text-align: right; padding-right: 4px; font-size: 11px; user-select: none; font-variant-numeric: tabular-nums; padding-top: 1px; }
.ln > .c { padding: 0 10px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.nowrap .ln > .c { white-space: pre; overflow-wrap: normal; }
.ln.add { background: var(--add-bg); } .ln.add > .o, .ln.add > .n { background: var(--add-num); }
.ln.del { background: var(--del-bg); } .ln.del > .o, .ln.del > .n { background: var(--del-num); }
.ln.add > .c::before { content: "+"; color: var(--add-ink); margin-left: -6px; display: inline-block; width: 6px; }
.ln.del > .c::before { content: "−"; color: var(--del-ink); margin-left: -6px; display: inline-block; width: 6px; }
.diff.nodel .ln { grid-template-columns: 3.6ch minmax(0, 1fr); }
.diff.nodel.nowrap .ln { grid-template-columns: 3.6ch max-content; }
.diff.nodel .ln > .o { display: none; }
.ln.delmark { box-shadow: inset 0 2px var(--del-ink); }
.ln:hover > .c { box-shadow: inset 2px 0 var(--accent); }
.ln.has-cmt > .n, .ln.has-cmt > .o { box-shadow: inset -3px 0 var(--accent); }
.ln.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 40% { background: var(--flash); } }
@media (prefers-reduced-motion: reduce) { .ln.flash { animation: none; background: var(--flash); } }

.thread, .composer { font-family: var(--ui); font-size: 14px; background: var(--cmt-bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.nowrap .thread, .nowrap .composer { position: sticky; left: 0; max-width: calc(100vw - 34px); }
.cmt { display: flex; flex-direction: column; gap: 4px; }
.cmt + .cmt { border-top: 1px dashed var(--line); padding-top: 8px; }
.cmt .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.cmt.done .body { color: var(--muted); text-decoration: line-through; }
.cmt .orig { display: flex; flex-direction: column; gap: 2px; }
.cmt .orig code { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.cmt .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cmt .acts .btn { min-height: 28px; padding: 2px 9px; font-size: 12.5px; }
.composer textarea { width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.composer .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.composer .err { color: var(--del-ink); font-size: 13px; }

.fold { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--hunk); color: var(--muted); font-family: var(--ui); font-size: 12.5px; padding: 6px 12px; cursor: pointer; }
.nowrap .fold { position: sticky; left: 0; width: calc(100vw - 34px); }
.jump {
  position: fixed; z-index: 6;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 2px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 4px 16px rgb(0 0 0 / .18);
}
.jump .btn { min-width: 44px; min-height: 40px; justify-content: center; font-size: 16px; border: 0; background: transparent; }
.jump .meta { min-width: 6ch; text-align: center; }
.pager { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pager .btn { max-width: 48%; overflow: hidden; text-overflow: ellipsis; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 14px; }
.refs {
  position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 62vh;
  display: flex; flex-direction: column; font-family: var(--ui);
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
  box-shadow: 0 -6px 24px rgb(0 0 0 / .22); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.refs-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.refs-head b { font-family: var(--mono); font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.refs-list { overflow-y: auto; padding: 2px 0 12px; }
.refs-list h3 { margin: 12px 12px 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.refs-file { padding: 8px 12px 2px; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.refs-row { display: grid; grid-template-columns: 5ch minmax(0, 1fr); gap: 8px; padding: 6px 12px; color: var(--ink); text-decoration: none; font-family: var(--mono); font-size: 12.5px; }
.refs-row .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.refs-row code { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
a.refs-row:hover, a.refs-row:focus-visible { background: var(--hunk); }
.refs-row.here { background: var(--accent-soft); }
.refs-row.off { color: var(--muted); }

.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta { color: var(--kw); }
.hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-template-variable, .hljs-symbol { color: var(--str); }
.hljs-number { color: var(--num); }
.hljs-comment, .hljs-quote { color: var(--com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--fn); }
.hljs-type, .hljs-title.class_, .hljs-class, .hljs-attr, .hljs-property, .hljs-params { color: var(--type); }
.hljs-attr, .hljs-property { color: var(--fn); }
.hljs-params { color: inherit; }
.hljs-variable.language_, .hljs-subst { color: inherit; }
</style>

<header class="bar" id="bar"></header>
<main id="main"></main>

<script id="diff-data" type="application/json">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('diff-data').textContent);
const FILES = DATA.files;
const BY_ID = new Map(FILES.map((f, i) => [f.id, i]));
const BY_PATH = new Map(FILES.map((f) => [f.path, f]));
const LANG = { ts: 'typescript', mts: 'typescript', js: 'javascript', mjs: 'javascript', cjs: 'javascript', json: 'json', md: 'markdown', yml: 'yaml', yaml: 'yaml', sh: 'bash', css: 'css', html: 'xml' };

const state = { comments: [], reviewed: new Set(), stale: new Set(), db: null, dbNote: '', readOnly: false, wrap: true, full: true, del: true, composer: null, onIndex: true, indexY: 0 };
try { state.wrap = localStorage.getItem('wrap') !== '0'; state.full = localStorage.getItem('mode') !== 'changes'; state.del = localStorage.getItem('del') !== '0'; } catch {}
const FOLD_CONTEXT = 4;
state.search = { open: false, q: '', matches: [], idx: -1 };
let searchTimer = 0;

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
  return node;
};
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const ext = (p) => (p.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase();
const highlight = (s, lang) => {
  if (!lang || !window.hljs) return esc(s);
  try { return hljs.highlight(s, { language: lang, ignoreIllegals: true }).value; } catch { return esc(s); }
};
const splitPath = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? ['', p] : [p.slice(0, i + 1), p.slice(i + 1)]; };
const lineKey = (side, line) => side + line;
const openComments = (fid) => state.comments.filter((c) => c.fid === fid && !c.done);
const fmtTime = (iso) => { try { return new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };

function parseHash() {
  const m = location.hash.match(/^#(f[0-9a-f]{8})(?:-([no])(\d+))?$/);
  if (!m || !BY_ID.has(m[1])) return { view: 'index' };
  return { view: 'file', fid: m[1], side: m[2], line: m[3] ? Number(m[3]) : null };
}

function render() {
  const route = parseHash();
  state.onIndex = route.view === 'index';
  if (route.view === 'file') { renderFile(route); return; }
  renderIndex();
  window.scrollTo(0, state.indexY);
}

function progressBar() {
  const pct = FILES.length ? (state.reviewed.size / FILES.length) * 100 : 0;
  return el('div', { class: 'progress', role: 'progressbar', 'aria-valuenow': Math.round(pct), 'aria-valuemin': 0, 'aria-valuemax': 100 }, el('i', { style: `width:${pct}%` }));
}

function renderIndex() {
  const add = FILES.reduce((s, f) => s + f.add, 0);
  const del = FILES.reduce((s, f) => s + f.del, 0);
  const bar = $('#bar');
  bar.replaceChildren(
    el('div', { class: 'bar-row' },
      el('div', { class: 'bar-title', text: '커밋 전 변경 리뷰' }),
      el('span', { class: 'meta', text: `확인 ${state.reviewed.size}/${FILES.length}` })),
    progressBar(),
    el('div', { class: 'meta' },
      `${DATA.branch} · HEAD ${DATA.head} + 작업 트리 · `,
      el('span', { class: 'plus', text: `+${add}` }), ' ', el('span', { class: 'minus', text: `−${del}` }),
      ` · ${fmtTime(DATA.generatedAt)} 기준`),
  );

  const main = $('#main');
  main.replaceChildren();
  if (state.dbNote) main.append(el('div', { class: `note${state.readOnly ? ' warn' : ''}`, text: state.dbNote }));

  const open = state.comments.filter((c) => !c.done);
  const cmtSection = el('section', { class: 'group' }, el('h2', { text: `열린 코멘트 ${open.length}` }));
  if (!open.length) {
    cmtSection.append(el('div', { class: 'empty', text: '아직 코멘트가 없습니다. 파일을 열고 줄을 누르면 그 줄에 코멘트를 남길 수 있습니다.' }));
  } else {
    const list = el('div', { class: 'list cmt-list' });
    for (const c of [...open].sort((a, b) => (a.path + a.side + String(a.line).padStart(6, '0')).localeCompare(b.path + b.side + String(b.line).padStart(6, '0')))) {
      list.append(el('a', { class: 'row', href: `#${c.fid}-${c.side}${c.line}` },
        el('div', { style: 'min-width:0;display:flex;flex-direction:column;gap:2px' },
          el('div', { class: 'where', text: `${c.path}:${c.line}${c.side === 'o' ? ' (삭제된 줄)' : ''}` }),
          el('div', { class: 'body', text: c.body })),
        el('span', { class: 'meta', text: '›' })));
    }
    cmtSection.append(list);
  }
  main.append(cmtSection);

  const groups = new Map();
  for (const f of FILES) {
    const top = f.path.includes('/') ? f.path.split('/')[0] + '/' : '루트';
    if (!groups.has(top)) groups.set(top, []);
    groups.get(top).push(f);
  }
  for (const [name, files] of groups) {
    const list = el('div', { class: 'list' });
    for (const f of files) {
      const [dir, base] = splitPath(f.path);
      const n = openComments(f.id).length;
      const done = state.reviewed.has(f.id);
      const stale = state.stale.has(f.id);
      list.append(el('a', { class: `row${done ? ' done' : ''}`, href: `#${f.id}` },
        el('span', { class: `st ${f.status}`, text: f.status, title: { A: '새 파일', M: '수정', D: '삭제' }[f.status] }),
        el('span', { class: 'p' }, el('span', { text: dir }), el('b', { text: base })),
        el('span', { class: 'r' },
          n ? el('span', { class: 'chip', text: `💬${n}` }) : null,
          el('span', { class: 'plus', text: `+${f.add}` }),
          el('span', { class: 'minus', text: `−${f.del}` }),
          done ? el('span', { class: 'check', text: '✓', title: '확인함' }) : null,
          stale ? el('span', { class: 'stale', text: '바뀜', title: '확인한 뒤 다시 바뀌었습니다' }) : null)));
    }
    main.append(el('section', { class: 'group' }, el('h2', { text: `${name} ${files.length}` }), list));
  }
}

function renderFile(route) {
  const idx = BY_ID.get(route.fid);
  const f = FILES[idx];
  const prev = FILES[idx - 1];
  const next = FILES[idx + 1];
  const done = state.reviewed.has(f.id);

  const bar = $('#bar');
  bar.replaceChildren(
    el('div', { class: 'bar-row tools' },
      el('a', { class: 'btn', href: '#', 'aria-label': '파일 목록' }, '‹ 목록'),
      el('span', { class: 'meta', text: `${idx + 1}/${FILES.length}` }),
      el('span', { style: 'flex:1' }),
      el('button', { class: `btn${state.search.open ? ' on' : ''}`, id: 'find-btn', type: 'button', onclick: openSearch }, '찾기'),
      el('button', { class: `btn${state.full ? ' on' : ''}`, type: 'button', onclick: toggleFull, title: '끄면 바뀐 곳 주변만 보입니다' }, '전체'),

      el('button', { class: `btn${done ? ' on' : ''}`, id: 'rv-btn', type: 'button', onclick: () => toggleReviewed(f), disabled: !state.db || state.readOnly }, done ? '✓ 확인함' : '확인'),

    el('div', { class: 'bar-row find', id: 'find-row', hidden: !state.search.open },

      el('button', { class: 'btn', type: 'button', 'aria-label': '다음 결과', onclick: () => goMatch(1) }, '↓'),
      el('button', { class: 'btn', type: 'button', 'aria-label': '찾기 닫기', onclick: closeSearch }, '✕')),

  const main = $('#main');
  main.replaceChildren();
  if (state.dbNote) main.append(el('div', { class: `note${state.readOnly ? ' warn' : ''}`, text: state.dbNote }));

  const hideDel = hidesDel(f);
  const diff = el('div', { class: `diff${state.wrap ? '' : ' nowrap'}${hideDel ? ' nodel' : ''}`, id: 'diff' });
  if (f.binary) diff.append(el('div', { class: 'hunk', text: '바이너리 파일이라 내용을 보여 주지 않습니다.' }));
  const lang = LANG[ext(f.path)];
  const keep = new Set(state.comments.filter((c) => c.fid === f.id).map((c) => lineKey(c.side, c.line)));
  if (route.line) keep.add(lineKey(route.side, route.line));
  const makeRow = (lines, i) => {
    const [t, o, n, s] = lines[i];
    const side = t === '-' ? 'o' : 'n';
    const line = t === '-' ? o : n;
    let k = i - 1;
    if (hideDel) while (k >= 0 && lines[k][0] === '-') k--;
    const delmark = k < i - 1;
    const chg = (t !== ' ' || delmark) && (k < 0 || lines[k][0] === ' ');
    const row = el('div', {
      class: `ln${t === '+' ? ' add' : t === '-' ? ' del' : ''}${chg ? ' chg' : ''}${delmark ? ' delmark' : ''}`,
      id: `${f.id}-${side}${line}`,
      'data-key': lineKey(side, line),
      'data-code': s,

      el('span', { class: 'o', text: o || '' }),

    const lines = h.lines;

    for (let i = 0; i < lines.length;) {

        i++;

      const from = i;
      const to = j;

    el('span', { class: 'meta', id: 'jump-count' }),
    el('button', { class: 'btn', type: 'button', 'aria-label': '다음 변경', onclick: () => jumpChange(1) }, '↓')));

  state.search.idx = -1;
  applyMarks();
  main.append(el('div', { class: 'pager' },
    el('a', { class: 'btn', href: prev ? `#${prev.id}` : '#', 'aria-disabled': prev ? null : 'true' }, prev ? `‹ ${splitPath(prev.path)[1]}` : '처음'),
    el('a', { class: 'btn', href: next ? `#${next.id}` : '#', 'aria-disabled': next ? null : 'true' }, next ? `${splitPath(next.path)[1]} ›` : '마지막')));

  } else {
    const first = $('#diff .ln.chg');
    if (first && route.keepScroll === undefined) requestAnimationFrame(() => { first.scrollIntoView({ block: 'start' }); updateJump(); });
    else window.scrollTo(0, 0);

}

function setBarHeight() {
  document.documentElement.style.setProperty('--bar-h', `${$('#bar').offsetHeight + 12}px`);
}
function currentFile() {
  const route = parseHash();

}

function findMatches(f, q) {
  const out = [];
  if (!q) return out;
  const needle = q.toLowerCase();
  const hideDel = hidesDel(f);
  f.hunks.forEach((h, hi) => h.lines.forEach(([t, o, n, s], li) => {
    if (hideDel && t === '-') return;
    const hay = s.toLowerCase();
    for (let at = hay.indexOf(needle); at >= 0; at = hay.indexOf(needle, at + needle.length)) {
      out.push({ hi, li, key: lineKey(t === '-' ? 'o' : 'n', t === '-' ? o : n), start: at, end: at + needle.length });

}
function applyMarks() {

    row.classList.remove('hit');
    row.querySelector('.c').innerHTML = highlight(row.dataset.code, lang) || ' ';

  const byKey = new Map();
  state.search.matches.forEach((m, i) => {
    if (!byKey.has(m.key)) byKey.set(m.key, []);
    byKey.get(m.key).push([m, i]);

  for (const [key, list] of byKey) {
    const row = document.getElementById(`${f.id}-${key}`);
    if (!row) continue;

// 하이라이트 span 경계를 넘는 결과도 칠하도록, 줄 전체 기준 위치를 텍스트 노드마다 잘라 감싼다.

    const end = base + node.data.length;
    const parts = list.filter(([m]) => m.start < end && m.end > base);
    if (!parts.length) continue;
    const frag = document.createDocumentFragment();
    let cursor = 0;
    for (const [m, i] of parts) {
      const a = Math.max(m.start - base, 0);
      const b = Math.min(m.end - base, node.data.length);
      if (a > cursor) frag.append(node.data.slice(cursor, a));
      frag.append(el('mark', { 'data-m': i, text: node.data.slice(a, b) }));

function goMatch(dir) {

    const top = changeTop();
    i = matches.findIndex((m) => {
      const row = document.getElementById(`${f.id}-${m.key}`);
      return row && row.getBoundingClientRect().top >= top - 4;

window.addEventListener('keydown', (e) => {

function visibleLines(lines, keep) {
  if (state.full) return lines.map(() => true);
  const near = new Array(lines.length).fill(Infinity);
  let last = -Infinity;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i][0] !== ' ') last = i;
    near[i] = i - last;
  }
  last = Infinity;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i][0] !== ' ') last = i;
    near[i] = Math.min(near[i], last - i);
  }
  return lines.map(([t, o, n], i) => near[i] <= FOLD_CONTEXT || keep.has(lineKey(t === '-' ? 'o' : 'n', t === '-' ? o : n)));
}

const changeTop = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-h')) || 120;
function jumpChange(dir) {

function paintThreads(f) {
  const diff = $('#diff');
  if (!diff) return;
  diff.querySelectorAll('.thread').forEach((n) => n.remove());
  diff.querySelectorAll('.ln.has-cmt').forEach((n) => n.classList.remove('has-cmt'));
  const mine = state.comments.filter((c) => c.fid === f.id);
  const byKey = new Map();
  for (const c of mine) {
    const k = lineKey(c.side, c.line);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(c);
  }
  const lost = [];
  for (const [k, list] of byKey) {
    const row = diff.querySelector(`.ln[data-key="${k}"]`);
    if (!row) { lost.push(...list); continue; }
    row.classList.add('has-cmt');
    const anchor = row.nextElementSibling?.classList.contains('composer') ? row.nextElementSibling : row;
    anchor.after(threadEl(list, null, row.dataset.code));
  }
  if (lost.length) diff.prepend(threadEl(lost, '이 diff 에서 줄을 찾지 못한 코멘트'));
}

function threadEl(list, title, current) {
  const box = el('div', { class: 'thread' });
  if (title) box.append(el('div', { class: 'meta', text: title }));
  for (const c of [...list].sort((a, b) => a.at.localeCompare(b.at))) {
    const del = el('button', { class: 'btn', type: 'button' }, '삭제');
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (del.dataset.arm) { removeComment(c); return; }
      del.dataset.arm = '1'; del.textContent = '한 번 더 눌러 삭제'; del.classList.add('on');
      setTimeout(() => { delete del.dataset.arm; del.textContent = '삭제'; del.classList.remove('on'); }, 3000);
    });
    box.append(el('div', { class: `cmt${c.done ? ' done' : ''}` },
      el('div', { class: 'body', text: c.body }),
      typeof c.code === 'string' && (title || c.code !== current)
        ? el('div', { class: 'orig' }, el('span', { class: 'meta', text: title ? '줄 내용' : '원래 줄(그 뒤 바뀜)' }), el('code', { text: c.code || ' ' }))
        : null,
      el('div', { class: 'acts' },
        el('span', { class: 'meta', text: `${lost(c)}${fmtTime(c.at)}${c.done ? ' · 해결됨' : ''}` }),
        state.readOnly || !state.db ? null : el('button', { class: 'btn', type: 'button', onclick: (e) => { e.stopPropagation(); toggleDone(c); } }, c.done ? '다시 열기' : '해결'),
        state.readOnly || !state.db ? null : del)));
  }
  return box;
  function lost(c) { return title ? `${c.side === 'o' ? '삭제 줄 ' : ''}${c.line}행 · ` : ''; }
}

function openComposer(f, side, line, code, row) {
  if (state.composer) {
    const same = state.composer.key === lineKey(side, line);
    if (state.composer.node.querySelector('textarea').value.trim() && !same) { state.composer.node.querySelector('textarea').focus(); return; }
    state.composer.node.remove();
    state.composer = null;
    if (same) return;
  }
  if (!state.db) { flashNote('코멘트 저장소에 연결되지 않아 지금은 코멘트를 남길 수 없습니다.'); return; }
  if (state.readOnly) { flashNote('이 화면에서는 코멘트를 쓸 권한이 없습니다.'); return; }
  const ta = el('textarea', { id: 'composer-text', placeholder: `${side === 'o' ? '삭제된 ' : ''}${line}행에 대한 코멘트`, 'aria-label': '코멘트' });
  const err = el('div', { class: 'err', hidden: true });
  const save = el('button', { class: 'btn primary', type: 'button' }, '저장');
  const cancel = el('button', { class: 'btn', type: 'button' }, '취소');
  const node = el('div', { class: 'composer', onclick: (e) => e.stopPropagation() }, ta, err, el('div', { class: 'acts' }, cancel, save));
  cancel.addEventListener('click', () => { node.remove(); state.composer = null; });
  save.addEventListener('click', async () => {
    const body = ta.value.trim();
    if (!body) { ta.focus(); return; }
    save.disabled = true; save.textContent = '저장 중';
    try {
      await state.db.collection('comments').add({ fid: f.id, path: f.path, side, line, code, body, at: new Date().toISOString(), done: false });
      node.remove(); state.composer = null;
    } catch (e) {
      err.hidden = false;
      err.textContent = e?.code === 'quota_exceeded' ? '코멘트 저장 공간이 가득 찼습니다. 해결된 코멘트를 지운 뒤 다시 저장해 주세요.' : `저장하지 못했습니다(${e?.code || '오류'}). 다시 눌러 주세요.`;
      save.disabled = false; save.textContent = '저장';

  state.composer = { key: lineKey(side, line), node };
  ta.focus();

// 참조: build.mjs 가 refs.mjs 로 모은 TypeScript 심볼. "파일번호:줄:이름" 으로 찾는다.

function openRefs(f, line, name, row) {

  for (const [title, groups] of [[`정의 ${count(d)}`, d], [`사용 ${count(r)}`, r]]) {
    if (!groups.length) continue;
    list.append(el('h3', { text: title }));
    for (const [gp, lines] of groups) {
      const path = REFS.paths[gp];
      const target = BY_PATH.get(path);
      list.append(el('div', { class: 'refs-file', text: target ? path : `${path} (변경 없음)` }));
      for (const l of lines) {
        const text = (target ? newLineText(target, l) : REFS.snippets[gp]?.[l] ?? '').trim();
        const kids = [el('span', { class: 'n', text: l }), el('code', { text })];
        list.append(target
          ? el('a', { class: `refs-row${gp === p && l === line ? ' here' : ''}`, href: `#${target.id}-n${l}` }, ...kids)
          : el('div', { class: 'refs-row off' }, ...kids));
      }
    }
  }
  document.body.append(el('div', { class: 'refs', id: 'refs', role: 'dialog', 'aria-label': `${symbol} 참조` },
    el('div', { class: 'refs-head' },
      el('b', { text: symbol }),
      el('span', { class: 'meta', text: `정의 ${count(d)}, 사용 ${count(r)}` }),
      el('span', { style: 'flex:1' }),
      el('button', { class: 'btn', type: 'button', onclick: () => { closeRefs(); openComposer(f, 'n', line, row.dataset.code, row); } }, '코멘트'),
      el('button', { class: 'btn', type: 'button', 'aria-label': '닫기', onclick: closeRefs }, '✕')),
    list));
  return true;
}
window.addEventListener('hashchange', closeRefs);

function flashNote(text) {
  state.dbNote = text;
  render();
}

async function removeComment(c) {
  try { await state.db.collection('comments').doc(c.id).delete(); } catch (e) { flashNote(`코멘트를 지우지 못했습니다(${e?.code || '오류'}).`); }
}
async function toggleDone(c) {
  try { await state.db.collection('comments').doc(c.id).update({ done: !c.done }); } catch (e) { flashNote(`상태를 바꾸지 못했습니다(${e?.code || '오류'}).`); }
}
async function toggleReviewed(f) {
  const ref = state.db.collection('reviewed').doc(f.id);
  try {
    if (state.reviewed.has(f.id)) await ref.delete();
    else await ref.set({ path: f.path, hash: f.hash, at: new Date().toISOString() });
  } catch (e) {
    if (e?.code === 'invalid_argument') { state.readOnly = true; state.dbNote = '이 화면에서는 기록할 권한이 없어 읽기만 됩니다.'; }
    else state.dbNote = `확인 표시를 저장하지 못했습니다(${e?.code || '오류'}).`;
    render();
  }
}
function toggleWrap() {
  state.wrap = !state.wrap;
  try { localStorage.setItem('wrap', state.wrap ? '1' : '0'); } catch {}
  rerenderAtSameLine();
}
const hidesDel = (f) => !state.del && f.status !== 'D';
function toggleDel() {
  state.del = !state.del;
  try { localStorage.setItem('del', state.del ? '1' : '0'); } catch {}
  rerenderAtSameLine();
}
function toggleFull() {
  state.full = !state.full;
  try { localStorage.setItem('mode', state.full ? 'full' : 'changes'); } catch {}
  rerenderAtSameLine();
}
function rerenderAtSameLine() {
  const top = changeTop();
  const rows = [...document.querySelectorAll('#diff .ln')];
  const anchor = rows.find((r) => r.getBoundingClientRect().top >= top - 2);
  const offset = anchor ? anchor.getBoundingClientRect().top : 0;
  const route = parseHash();
  if (route.view !== 'file') { render(); return; }
  renderFile({ ...route, line: null, keepScroll: true });
  const again = anchor && document.getElementById(anchor.id);
  if (again) window.scrollTo(0, window.scrollY + again.getBoundingClientRect().top - offset);
  else if (anchor) {
    const side = anchor.dataset.key[0];
    const line = Number(anchor.dataset.key.slice(1));
    const near = [...document.querySelectorAll('#diff .ln')].find((r) => r.dataset.key[0] === side && Number(r.dataset.key.slice(1)) >= line);
    near?.scrollIntoView({ block: 'start' });
  }
  updateJump();
}

function rerenderKeepingPlace() {
  const route = parseHash();
  if (route.view === 'file') {
    const f = FILES[BY_ID.get(route.fid)];
    paintThreads(f);
    const btn = $('#rv-btn');
    const done = state.reviewed.has(f.id);
    btn.classList.toggle('on', done); btn.textContent = done ? '✓ 확인함' : '확인';
    btn.disabled = !state.db || state.readOnly;
    $('#bar .progress').replaceWith(progressBar());
  } else {
    const y = window.scrollY;
    renderIndex();
    window.scrollTo(0, y);
  }
}

// 파일을 그린 뒤의 스크롤은 목록 위치가 아니므로 목록을 보는 동안만 기록한다.
window.addEventListener('scroll', () => { if (state.onIndex) state.indexY = window.scrollY; }, { passive: true });
window.addEventListener('hashchange', render);
render();

(async () => {
  const db = await window.claude?.use?.('db');
  if (!db) {
    state.dbNote = '코멘트 저장소를 쓸 수 없는 화면입니다. diff 는 읽을 수 있지만 코멘트와 확인 표시는 저장되지 않습니다.';
    rerenderKeepingPlace();
    return;
  }
  state.db = db;
  let pending = 2;
  const timer = setTimeout(() => { state.dbNote = '코멘트를 아직 불러오지 못했습니다. 연결되면 자동으로 나타납니다.'; rerenderKeepingPlace(); }, 10000);
  const settle = (snap) => {
    if (!snap.metadata.fromCache && --pending <= 0) { clearTimeout(timer); if (state.dbNote.startsWith('코멘트를 아직')) state.dbNote = ''; }
  };
  const fail = (e) => { clearTimeout(timer); state.dbNote = `코멘트 저장소 연결이 끊겼습니다(${e.code}). 페이지를 다시 열어 주세요.`; rerenderKeepingPlace(); };
  db.collection('comments').onSnapshot((snap) => {
    state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    settle(snap);
    rerenderKeepingPlace();
  }, fail);
  db.collection('reviewed').onSnapshot((snap) => {
    const hashes = new Map(FILES.map((f) => [f.id, f.hash]));
    const docs = snap.docs.filter((d) => hashes.has(d.id));
    state.reviewed = new Set(docs.filter((d) => d.data().hash === hashes.get(d.id)).map((d) => d.id));
    state.stale = new Set(docs.filter((d) => !state.reviewed.has(d.id)).map((d) => d.id));
    settle(snap);
    rerenderKeepingPlace();
  }, fail);
  rerenderKeepingPlace();
})();
</script>
